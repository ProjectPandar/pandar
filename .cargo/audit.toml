[advisories]
ignore = [
    # rkyv 0.7.46 enters Cargo.lock only as an unactivated optional dependency
    # (sea-orm -> rust_decimal -> rkyv ^0.7.46). No workspace target compiles it:
    # `cargo tree --workspace --all-features --edges normal,dev,build --target all`
    # contains no rkyv. rust_decimal 1.42.1 is the latest release and still
    # requires rkyv ^0.7.46, so no upgrade path exists. Revisit when sea-orm or
    # rust_decimal move to rkyv 0.8.
    "RUSTSEC-2026-0235",
    # libsqlite3-sys 0.37 (bundled SQLite < 3.54) enters only through sqlx-sqlite
    # 0.9.0, the latest sqlx release, which requires libsqlite3-sys >=0.30.1,
    # <0.38.0, so the patched 0.39 cannot be selected. The CVE needs a process to
    # open a database plus `-wal` pair written by a less trusted party; the Hub
    # only opens its own operator-configured database. Revisit when sqlx allows
    # libsqlite3-sys >= 0.39.
    "RUSTSEC-2026-0459",
]

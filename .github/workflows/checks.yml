name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # Lets a failed pull request job dispatch cancel-run.yml (fail fast).
  actions: write

# Pull requests only need their newest push checked. Every main commit gets a
# unique group so it is never cancelled or replaced while pending; Docker and
# Release gate on the main run for the exact SHA they publish.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Documentation-only changes skip the heavy jobs inside the workflow instead of
  # through `on.paths`: a workflow that never starts leaves required checks
  # pending forever and leaves the Docker/Release gates without a Checks run.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ]; then
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
            || ! files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Markdown and docs/ are documentation, except docs/deployment, which
          # CI lints (Helm chart) and diffs (NixOS options reference).
          if grep -Evq '\.md$|^docs/|^$' <<< "$files" || grep -q '^docs/deployment/' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-quality:
    name: Frontend tests and type checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify generated Hub clients
        run: npm run check:hub-clients

      - name: Lint Web
        run: npm run lint:web

      - name: Run Web tests
        run: npm run test:web

      - name: Run Auth tests
        run: npm run test:auth

      - name: Type-check Web
        run: npm run typecheck:web

      - name: Type-check Auth
        run: npm run typecheck:auth

      - name: Cancel the rest of the pull request run
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cancel-run.yml --repo "$GITHUB_REPOSITORY" --ref main -f run-id="$GITHUB_RUN_ID"

  rust-security:
    name: Rust security audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install prebuilt cargo-audit
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Cancel the rest of the pull request run
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cancel-run.yml --repo "$GITHUB_REPOSITORY" --ref main -f run-id="$GITHUB_RUN_ID"

  helm-chart:
    name: Helm chart
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint chart
        run: helm lint docs/deployment/kubernetes --set hub.accessCodeEncryption.existingSecret=pandar-hub-secrets

      - name: Verify deployment security defaults
        run: scripts/check-deployment-security.sh

      - name: Cancel the rest of the pull request run
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cancel-run.yml --repo "$GITHUB_REPOSITORY" --ref main -f run-id="$GITHUB_RUN_ID"

  studio-contract-checks:
    name: Studio contracts and ABI probes (${{ matrix.partition }}/3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]

    steps:
      - name: Checkout Pandar
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # One shallow fetch of every catalogued commit lets the pack share deltas
      # between Studio versions; a full clone or one fetch per commit is slower.
      - name: Fetch pinned Bambu Studio commits
        shell: bash
        run: |
          set -euo pipefail
          pinned=42d319c6692fa8e64790fddf0cdaafd2a4254bcc
          mapfile -t commits < <({ jq -r '.abi_series[].studio_commit' studio-abi-profiles.json; echo "$pinned"; } | sort -u)
          git init --quiet reference/BambuStudio
          git -C reference/BambuStudio fetch --no-tags --depth=1 \
            https://github.com/bambulab/BambuStudio.git "${commits[@]}"
          git -C reference/BambuStudio checkout --quiet --detach "$pinned"

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up hestia cache
        uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          version: v3.0.0
          upstream-cache-filter: true
          no-closure: true

      # Also runs the machine-exclusive Studio ABI probe binaries that the
      # pandar-nextest check leaves out, so their serial runtime is sharded.
      - name: Run Studio contract and ABI probe binaries
        run: >-
          nix develop --command cargo nextest run
          -p pandar-network-plugin
          -E 'binary(studio_print_contract_red) | binary(studio_projection_contract) | binary(personal_presets)
          | binary(studio_abi_probe) | binary(task_token_refresh) | binary(logout_revoke)
          | binary(logout_revoke_upgrade) | binary(no_auth_credential_hygiene)'
          --partition count:${{ matrix.partition }}/3
          --no-tests=fail

      - name: Cancel the rest of the pull request run
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cancel-run.yml --repo "$GITHUB_REPOSITORY" --ref main -f run-id="$GITHUB_RUN_ID"

  nix-lint:
    name: Nix lint checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up hestia cache
        uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          version: v3.0.0
          upstream-cache-filter: true
          no-closure: true

      - name: Verify generated Hub migrations
        run: scripts/sync-hub-migrations.sh --check

      - name: Run lint checks
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.pandar-fmt \
            .#checks.x86_64-linux.pandar-clippy \
            .#checks.x86_64-linux.pandar-module-size \
            .#checks.x86_64-linux.pandar-nixos-options-doc

      - name: Cancel the rest of the pull request run
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cancel-run.yml --repo "$GITHUB_REPOSITORY" --ref main -f run-id="$GITHUB_RUN_ID"

  nix-test:
    name: Nix Rust tests (SQLite + PostgreSQL)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up hestia cache
        uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          version: v3.0.0
          upstream-cache-filter: true
          no-closure: true

      - name: Run workspace tests
        run: nix build --print-build-logs .#checks.x86_64-linux.pandar-nextest

      - name: Cancel the rest of the pull request run
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cancel-run.yml --repo "$GITHUB_REPOSITORY" --ref main -f run-id="$GITHUB_RUN_ID"

  # Packages and the NixOS VM tests that boot them share one job per system so
  # each package is built once and the VMs reuse it from the local store.
  nix-packages:
    name: Nix packages and NixOS VM tests (${{ matrix.system }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
            checks: >-
              pandar-hub pandar-agent pandar-cli pandar-auth pandar-web pandar-network-plugin
              pandar-auth-migrate pandar-auth-jwt-smoke pandar-auth-cookie-smoke
              pandar-web-auth-redirect-smoke pandar-nixos-module
              pandar-nixos-test-sqlite pandar-nixos-test-postgres
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            checks: >-
              pandar-hub pandar-agent pandar-cli pandar-auth pandar-web
              pandar-nixos-test-sqlite pandar-nixos-test-postgres

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up hestia cache
        uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          version: v3.0.0
          upstream-cache-filter: true
          no-closure: true

      - name: Build packages and run VM tests
        env:
          SYSTEM: ${{ matrix.system }}
          CHECKS: ${{ matrix.checks }}
        run: |
          installables=()
          for check in $CHECKS; do
            installables+=(".#checks.$SYSTEM.$check")
          done
          nix build --print-build-logs "${installables[@]}"

      - name: Cancel the rest of the pull request run
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cancel-run.yml --repo "$GITHUB_REPOSITORY" --ref main -f run-id="$GITHUB_RUN_ID"

  # Single required check: skipped jobs (documentation-only changes) count as
  # passing, failures and cancellations do not.
  checks-passed:
    name: Checks passed
    if: always()
    needs:
      - changes
      - frontend-quality
      - rust-security
      - helm-chart
      - studio-contract-checks
      - nix-lint
      - nix-test
      - nix-packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BOOST_URL: https://github.com/boostorg/boost/releases/download/boost-1.84.0/boost-1.84.0.tar.gz
  BOOST_SHA256: 4d27e9efed0f6f152dc28db6430b9d3dfb40c0345da7342eaa5a987dde57bd95

jobs:
  studio_abi_series:
    name: Load Bambu Studio ABI series
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      series: ${{ steps.matrix.outputs.series }}
      macos: ${{ steps.matrix.outputs.macos }}
    steps:
      - name: Checkout Pandar
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate ABI series matrices
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          series=$(jq -c '{include: [.abi_series[] | {abi_series: .id, studio_commit: .studio_commit}]}' studio-abi-profiles.json)
          # macOS runners are limited to 5 concurrent jobs per account, so each
          # macOS job builds a group of ABI series in sequence: dependencies
          # compile once and only the series-specific crates rebuild.
          macos=$(jq -c '
            [.abi_series[] | {abi_series: .id, studio_commit}] as $series
            | [range(0; $series | length; 4) as $i | $series[$i:$i + 4]] as $groups
            | [
                {label: "macos-amd64", target: "x86_64-apple-darwin"},
                {label: "macos-arm64", target: "aarch64-apple-darwin"}
              ] as $targets
            | {include: [$targets[] as $target | $groups | to_entries[] | $target + {group: (.key + 1), series: .value}]}
          ' studio-abi-profiles.json)
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"

  linux-amd64:
    name: Build Linux amd64 for Studio ABI ${{ matrix.abi_series }}
    needs: studio_abi_series
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.studio_abi_series.outputs.series) }}
    env:
      PANDAR_STUDIO_ABI_SERIES: ${{ matrix.abi_series }}
    steps:
      - name: Checkout Pandar
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout pinned Bambu Studio contract source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: bambulab/BambuStudio
          ref: ${{ matrix.studio_commit }}
          path: .release/BambuStudio
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install prebuilt cargo-zigbuild
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-zigbuild

      - name: Download pinned Boost source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          curl --fail --location --retry 3 --output .release/boost-1.84.0.tar.gz "$BOOST_URL"
          echo "$BOOST_SHA256  .release/boost-1.84.0.tar.gz" | sha256sum --check --strict

      - name: Build native release artifacts and ABI probe
        shell: bash
        run: |
          set -euo pipefail
          cargo zigbuild --release -p pandar-app --bin pandar --target x86_64-unknown-linux-musl
          cargo build --release -p pandar-network-plugin -p pandar-bambu-source \
            --target x86_64-unknown-linux-gnu
          cargo build --release --manifest-path tools/studio-abi-contract/Cargo.toml

      - name: Package exact three-file archive
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME:-manual}"
          safe_ref="${ref_name//\//-}"
          archive="pandar-release-${safe_ref}-studio-${{ matrix.abi_series }}-linux-amd64.tar.gz"
          stage="$RUNNER_TEMP/pandar-release-${{ matrix.abi_series }}-linux-amd64"
          mkdir -p "$stage" dist
          cp target/x86_64-unknown-linux-musl/release/pandar "$stage/pandar"
          cp target/x86_64-unknown-linux-gnu/release/libpandar_network_plugin.so "$stage/libpandar_network_plugin.so"
          cp target/x86_64-unknown-linux-gnu/release/libpandar_bambu_source.so "$stage/libpandar_bambu_source.so"
          tar -C "$stage" -czf "dist/$archive" \
            pandar libpandar_network_plugin.so libpandar_bambu_source.so
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Smoke packaged archive on its native host
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME:-manual}"
          safe_ref="${ref_name//\//-}"
          archive="dist/pandar-release-${safe_ref}-studio-${{ matrix.abi_series }}-linux-amd64.tar.gz"
          cargo run --manifest-path tools/release-smoke/Cargo.toml -- \
            --studio-abi-series "${{ matrix.abi_series }}" \
            --label linux-amd64 \
            --archive "$archive" \
            --checksum "$archive.sha256" \
            --cli-name pandar \
            --plugin-name libpandar_network_plugin.so \
            --source-name libpandar_bambu_source.so \
            --repo-root "$GITHUB_WORKSPACE" \
            --abi-probe tools/studio-abi-contract/target/release/pandar-studio-abi-contract \
            --abi-probe-arg --studio-source \
            --abi-probe-arg "$GITHUB_WORKSPACE/.release/BambuStudio" \
            --abi-probe-arg --boost-archive \
            --abi-probe-arg "$GITHUB_WORKSPACE/.release/boost-1.84.0.tar.gz"

      - name: Upload Linux release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pandar-release-studio-${{ matrix.abi_series }}-linux-amd64
          path: dist/*
          if-no-files-found: error

  windows-amd64:
    name: Build Windows amd64 for Studio ABI ${{ matrix.abi_series }}
    needs: studio_abi_series
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.studio_abi_series.outputs.series) }}
    env:
      PANDAR_STUDIO_ABI_SERIES: ${{ matrix.abi_series }}
    steps:
      - name: Checkout Pandar
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout pinned Bambu Studio contract source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: bambulab/BambuStudio
          ref: ${{ matrix.studio_commit }}
          path: .release/BambuStudio
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Download pinned Boost source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .release | Out-Null
          $archive = Join-Path $env:GITHUB_WORKSPACE ".release/boost-1.84.0.tar.gz"
          Invoke-WebRequest -Uri $env:BOOST_URL -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:BOOST_SHA256) {
            throw "Boost checksum mismatch: expected $env:BOOST_SHA256, got $actual"
          }

      - name: Build native release artifacts and ABI probe
        shell: pwsh
        run: |
          cargo build --release -p pandar-app -p pandar-network-plugin -p pandar-bambu-source -p pandar-studio-hook --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p pandar-studio-hook --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --manifest-path tools/studio-abi-contract/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release archive and Studio hook bundle
        shell: pwsh
        run: |
          $safeRef = ($env:GITHUB_REF_NAME ?? "manual").Replace("/", "-")
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $releaseStage = Join-Path $env:RUNNER_TEMP "pandar-release-$env:PANDAR_STUDIO_ABI_SERIES-windows-amd64"
          $hookStage = Join-Path $env:RUNNER_TEMP "pandar-studio-hook-$env:PANDAR_STUDIO_ABI_SERIES-windows-amd64"
          New-Item -ItemType Directory -Force -Path $dist, $releaseStage, $hookStage | Out-Null

          $target = Join-Path $env:GITHUB_WORKSPACE "target/x86_64-pc-windows-msvc/release"
          Copy-Item (Join-Path $target "pandar.exe") (Join-Path $releaseStage "pandar.exe")
          Copy-Item (Join-Path $target "pandar_network_plugin.dll") (Join-Path $releaseStage "pandar_network_plugin.dll")
          Copy-Item (Join-Path $target "pandar_bambu_source.dll") (Join-Path $releaseStage "pandar_bambu_source.dll")
          $releaseArchive = Join-Path $dist "pandar-release-$safeRef-studio-$env:PANDAR_STUDIO_ABI_SERIES-windows-amd64.tar.gz"
          tar -C $releaseStage -czf $releaseArchive pandar.exe pandar_network_plugin.dll pandar_bambu_source.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseHash = (Get-FileHash -Algorithm SHA256 $releaseArchive).Hash.ToLowerInvariant()
          "$releaseHash  $(Split-Path -Leaf $releaseArchive)" | Set-Content -NoNewline "$releaseArchive.sha256"

          Copy-Item (Join-Path $target "pandar_studio_hook.dll") (Join-Path $hookStage "pandar_studio_hook.dll")
          Copy-Item (Join-Path $target "pandar_network_plugin.dll") (Join-Path $hookStage "pandar_network_plugin.dll")
          Copy-Item (Join-Path $target "pandar_bambu_source.dll") (Join-Path $hookStage "pandar_bambu_source.dll")
          $hookArchive = Join-Path $dist "pandar-studio-hook-$env:PANDAR_STUDIO_ABI_SERIES-windows-amd64.zip"
          Compress-Archive -Path (Join-Path $hookStage "*") -DestinationPath $hookArchive -CompressionLevel Optimal
          $hookHash = (Get-FileHash -Algorithm SHA256 $hookArchive).Hash.ToLowerInvariant()
          "$hookHash  $(Split-Path -Leaf $hookArchive)" | Set-Content -NoNewline "$hookArchive.sha256"

      - name: Smoke packaged archive on its native host
        shell: pwsh
        run: |
          $safeRef = ($env:GITHUB_REF_NAME ?? "manual").Replace("/", "-")
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist/pandar-release-$safeRef-studio-$env:PANDAR_STUDIO_ABI_SERIES-windows-amd64.tar.gz"
          cargo run --manifest-path tools/release-smoke/Cargo.toml -- `
            --studio-abi-series $env:PANDAR_STUDIO_ABI_SERIES `
            --label windows-amd64 `
            --archive $archive `
            --checksum "$archive.sha256" `
            --cli-name pandar.exe `
            --plugin-name pandar_network_plugin.dll `
            --source-name pandar_bambu_source.dll `
            --repo-root $env:GITHUB_WORKSPACE `
            --abi-probe tools/studio-abi-contract/target/release/pandar-studio-abi-contract.exe `
            --abi-probe-arg --studio-source `
            --abi-probe-arg "$env:GITHUB_WORKSPACE/.release/BambuStudio" `
            --abi-probe-arg --boost-archive `
            --abi-probe-arg "$env:GITHUB_WORKSPACE/.release/boost-1.84.0.tar.gz"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pandar-release-studio-${{ matrix.abi_series }}-windows-amd64
          path: dist/*
          if-no-files-found: error

  macos:
    name: Build ${{ matrix.label }} for Studio ABI group ${{ matrix.group }} on Apple Silicon
    needs: studio_abi_series
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.studio_abi_series.outputs.macos) }}
    env:
      SERIES: ${{ toJSON(matrix.series) }}
    steps:
      - name: Checkout Pandar
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = arm64

      - name: Ensure Rosetta for amd64 validation
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      - name: Checkout pinned Bambu Studio contract source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: bambulab/BambuStudio
          ref: ${{ matrix.series[0].studio_commit }}
          path: .release/BambuStudio
          persist-credentials: false

      - name: Fetch the group's Studio commits
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.[].studio_commit' <<< "$SERIES" | while read -r commit; do
            git -C .release/BambuStudio fetch --no-tags --depth=1 origin "$commit"
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Download pinned Boost source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          curl --fail --location --retry 3 --output .release/boost-1.84.0.tar.gz "$BOOST_URL"
          printf '%s  %s\n' "$BOOST_SHA256" .release/boost-1.84.0.tar.gz | shasum -a 256 --check

      - name: Build, package, and smoke each Studio ABI series
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME:-manual}"
          safe_ref="${ref_name//\//-}"
          mkdir -p dist
          cargo build --release --target "$TARGET" \
            --manifest-path tools/studio-abi-contract/Cargo.toml
          jq -c '.[]' <<< "$SERIES" | while read -r entry; do
            series="$(jq -r .abi_series <<< "$entry")"
            commit="$(jq -r .studio_commit <<< "$entry")"
            echo "::group::Studio ABI $series"
            export PANDAR_STUDIO_ABI_SERIES="$series"
            git -C .release/BambuStudio checkout --quiet --detach "$commit"

            cargo build --release -p pandar-app --bin pandar --target "$TARGET"
            cargo build --release -p pandar-network-plugin -p pandar-bambu-source --target "$TARGET"

            archive="pandar-release-${safe_ref}-studio-${series}-${LABEL}.tar.gz"
            stage="$RUNNER_TEMP/pandar-release-${series}-${LABEL}"
            mkdir -p "$stage"
            cp "target/$TARGET/release/pandar" "$stage/pandar"
            cp "target/$TARGET/release/libpandar_network_plugin.dylib" "$stage/libpandar_network_plugin.dylib"
            cp "target/$TARGET/release/libpandar_bambu_source.dylib" "$stage/libpandar_bambu_source.dylib"
            COPYFILE_DISABLE=1 tar -C "$stage" -czf "dist/$archive" \
              pandar libpandar_network_plugin.dylib libpandar_bambu_source.dylib
            (cd dist && shasum -a 256 "$archive" > "$archive.sha256")

            cargo run --target "$TARGET" \
              --manifest-path tools/release-smoke/Cargo.toml -- \
              --studio-abi-series "$series" \
              --label "$LABEL" \
              --archive "dist/$archive" \
              --checksum "dist/$archive.sha256" \
              --cli-name pandar \
              --plugin-name libpandar_network_plugin.dylib \
              --source-name libpandar_bambu_source.dylib \
              --repo-root "$GITHUB_WORKSPACE" \
              --abi-probe "tools/studio-abi-contract/target/$TARGET/release/pandar-studio-abi-contract" \
              --abi-probe-arg --studio-source \
              --abi-probe-arg "$GITHUB_WORKSPACE/.release/BambuStudio" \
              --abi-probe-arg --boost-archive \
              --abi-probe-arg "$GITHUB_WORKSPACE/.release/boost-1.84.0.tar.gz"
            echo "::endgroup::"
          done

      - name: Upload macOS release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pandar-release-${{ matrix.label }}-group-${{ matrix.group }}
          path: dist/*
          if-no-files-found: error

  quality-gate:
    name: Verify Checks for release SHA
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 125
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify tagged release versions
        run: bash scripts/check-release-version.sh "${GITHUB_REF_NAME#v}"

      - name: Wait for successful Checks workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const deadline = Date.now() + 120 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "checks.yml",
                event: "push",
                head_sha: context.sha,
                per_page: 100,
              });
              const run = data.workflow_runs
                .filter(candidate => candidate.head_sha === context.sha)
                .sort((left, right) => right.run_number - left.run_number)[0];
              if (run?.status === "completed") {
                if (run.conclusion !== "success") {
                  core.setFailed(`Checks run ${run.html_url} concluded ${run.conclusion}`);
                } else {
                  core.info(`Checks passed for ${context.sha}: ${run.html_url}`);
                }
                return;
              }
              core.info(run
                ? `Checks run ${run.html_url} is ${run.status}`
                : `Waiting for a Checks run for ${context.sha}`);
              await new Promise(resolve => setTimeout(resolve, 15_000));
            }
            core.setFailed(`Timed out waiting for Checks on ${context.sha}`);

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - linux-amd64
      - macos
      - windows-amd64
      - quality-gate
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: pandar-release-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
